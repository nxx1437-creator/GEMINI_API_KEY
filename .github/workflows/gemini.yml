name: Gemini CLI
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, review_requested]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@main
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true' # <--- Dòng này là QUAN TRỌNG nhất
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          mode: agent
          # Bạn có thể thêm dòng này để bật log debug nhằm kiểm tra lỗi:
          # gemini_debug: true
