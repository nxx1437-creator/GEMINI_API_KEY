name: Gemini CLI
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, review_requested]

permissions:
  contents: write      # <--- Quan trọng: cho phép AI push code
  issues: write
  pull-requests: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@main
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          mode: agent
